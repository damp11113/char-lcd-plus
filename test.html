<!DOCTYPE html>
<html>
  <head>
    <title>char-lcd test</title>
    <script src="javascript/char-lcd.js"></script>
  </head>
<body>
  <h1>char-lcd test</h1>

  <div>
    <span id=lcd1></span>
    <span id=lcd0></span>
    <span id=lcd2></span>
  </div>
  <div>
    <span id=lcdjp></span>
    <span id=lcdv></span>
    <span id=lcdeu></span>
  </div>

  <h1>Example code in README.md</h1>
  <div id="lcd"></div>

  <h1>LCD Without Blur Effect</h1>
  <span id="unblur_lcd"></span>

  <h1>LCD With Blur Effect</h1>
  <span id="blur_lcd"></span>

  <h1>Backlight and Contrast</h1>
  <div><span id="real_lcd"></span></div>
  <div><span id="real_lcd_green"></span></div>

  <h1>GraphicLCD</h1>
  <div><span id="glcd"></span> <span id="glcd_gray"></span></div>

  <h1>Controls (for the LCDs above)</h1>
  <p>
    <button id="backlight_btn">Backlight: ON</button>
    <label>Contrast <input id="contrast_rng" type="range" min="0" max="1" step="0.01" value="0.6"> <span id="contrast_val">0.60</span></label>
  </p>
  <p>
    <label>Blue LCDs backlight color <input id="off_color" type="color" value="#2f46f0"></label>
    <label>Blue LCDs pixel color <input id="on_color" type="color" value="#dde3f2"></label>
  </p>

  <script>
    var i, j;
    var lcd0 = new CharLCD({ at: 'lcd0', rows: 1, cols: 1, off: '#fff', on: '#f00' });
    var lcd1 = new CharLCD({ at: 'lcd1', rows: 1, cols: 16, off: '#fff', on: '#000' });
    var lcd2 = new CharLCD({ at: 'lcd2', rows: 1, cols: 16, off: '#fff', on: '#000' });
    var lcdv = new CharLCD({ at: 'lcdv', rows: 16, cols: 1, off: '#fff', on: '#000' });
    var lcdjp = new CharLCD({ at: 'lcdjp', rows: 16, cols: 16 });
    var lcdeu = new CharLCD({ at: 'lcdeu', rows: 16, cols: 16, rom: 'eu', off: '#008', on: '#fe8' });
    lcd0.font(0, [0, 10, 21, 17, 10, 4]);
    lcd0.char(0, 0, String.fromCharCode(0));
    for (i = 0; i < 16; i++) {
      lcd1.char(0, i, "0123456789ABCDEF"[i]);
      lcd2.char(0, i, "0123456789ABCDEF"[i]);
      lcdv.char(i, 0, "0123456789ABCDEF"[i]);
      for (j = 0; j < 16; j++) {
        lcdjp.char(i, j, String.fromCharCode(i * 16 + j));
        lcdeu.char(i, j, String.fromCharCode(i * 16 + j));
      }
    }

    // code test for example code in README.md
    var lcd = new CharLCD({ at: 'lcd', rows: 4, cols: 16, rom: 'eu' } );

    // Example 1: Display a single custom character at row 0, column 0
    // To set a custom character, use String.fromCharCode to map a character byte (16-255).
    // In this case, use character code 16, which is the first non-blank character in the set.
    lcd.char(0, 0, String.fromCharCode(50));  // Set the custom character at row 0, column 0

    // Example 2: Display another custom character at row 1, column 0
    lcd.char(1, 0, String.fromCharCode(75));  // Set another custom character at row 1, column 0

    // Example 3: Display a string with mapped Unicode characters
    // The lcd.text() function will automatically map Unicode characters to the internal character set.
    lcd.text(2, 0, "Hello LCD!");
    lcd.text(3, 0, "ЁЛКИ-ПАЛКИ!");

    // blur test
    var lcd3 = new CharLCD({ at: 'unblur_lcd', rows: 3, cols: 16, rom: 'eu', transitionDuration: "0ms" } );
    var lcd4 = new CharLCD({ at: 'blur_lcd', rows: 3, cols: 16, rom: 'eu' } );

    function updateLCDText() {
      // Step-by-step text updates with a 2-second interval between each update
      setTimeout(function() {
        lcd3.clear();
        lcd4.clear();
    
        lcd3.text(0, 0, 'Hello, World!');
        lcd4.text(0, 0, 'Hello, World!');
    
        setTimeout(function() {
          lcd3.clear();
          lcd4.clear();
    
          lcd3.text(0, 0, 'char-lcd ');
          lcd4.text(0, 0, 'char-lcd ');
    
          setTimeout(function() {
            lcd3.clear();
            lcd4.clear();
    
            lcd3.text(0, 0, 'Testing...');
            lcd4.text(0, 0, 'Testing...');
    
            // Repeat the cycle by calling the update function again
            updateLCDText();
          }, 1000);  // Wait for 2 seconds before showing next text
    
        }, 1000);  // Wait for 2 seconds before showing the next row of text
    
      }, 1000);  // Wait for 2 seconds before showing the first row of text
    }
    
    // Start the text update loop
    updateLCDText();

    // backlight and contrast test
    var lcdBlue = new CharLCD({ at: 'real_lcd', rows: 2, cols: 16, pix: 4, off: '#2f46f0', on: '#dde3f2', contrast: 0.6, transitionDuration: '200ms' });
    var lcdGreen = new CharLCD({ at: 'real_lcd_green', rows: 2, cols: 16, pix: 4, contrast: 0.6, transitionDuration: '200ms' });
    lcdBlue.text(0, 0, '  Hello World!');
    lcdGreen.text(0, 0, '  Hello World!');

    // graphic LCD test
    var x, shade = [];
    var glcd = new GraphicLCD({ at: 'glcd', width: 128, height: 64, contrast: 0.6 });
    var gray = new GraphicLCD({ at: 'glcd_gray', width: 128, height: 64, grayscale: true, off: '#2f46f0', on: '#dde3f2', contrast: 0.6 });
    glcd.rect(0, 0, 128, 64);
    glcd.text(3, 3, 'GraphicLCD');
    glcd.line(0, 12, 127, 12);
    glcd.circle(16, 36, 10);
    glcd.fillRect(32, 26, 20, 20);
    glcd.rect(56, 26, 20, 20);
    glcd.line(56, 26, 75, 45);
    glcd.text(82, 16, 'ABC\nabc\n123', 1, 0);

    for (x = 0; x < 128; x++) gray.line(x, 0, x, 11, x * 2);
    gray.fillCircle(20, 38, 18, 255);
    gray.fillCircle(20, 38, 12, 150);
    gray.fillCircle(20, 38, 6, 60);
    gray.text(46, 16, 'Grayscale', 255);
    gray.text(46, 26, '0-255', 120);
    for (j = 0; j < 20; j++) {
      for (i = 0; i < 64; i++) shade.push(Math.max(0, 255 - Math.round(Math.hypot(i - 32, (j - 10) * 3) * 7)));
    }
    gray.bitmap(46, 40, 64, 20, shade);

    // bouncing ball, the fade leaves a short trail like a slow LCD
    var ball = { x: 110, y: 30, dx: 1, dy: 1 };
    setInterval(function() {
      glcd.fillCircle(ball.x, ball.y, 3, 0);
      if (ball.x + ball.dx < 104 || ball.x + ball.dx > 123) ball.dx = -ball.dx;
      if (ball.y + ball.dy < 17 || ball.y + ball.dy > 59) ball.dy = -ball.dy;
      ball.x += ball.dx;
      ball.y += ball.dy;
      glcd.fillCircle(ball.x, ball.y, 3);
    }, 40);

    var demos = [lcdBlue, lcdGreen, glcd, gray];
    document.getElementById('backlight_btn').onclick = function() {
      var on = !lcdBlue.backlight();
      demos.forEach(function(l) { l.backlight(on); });
      this.textContent = 'Backlight: ' + (on ? 'ON' : 'OFF');
    };
    document.getElementById('contrast_rng').oninput = function() {
      var value = this.value;
      demos.forEach(function(l) { l.contrast(value); });
      document.getElementById('contrast_val').textContent = lcdBlue.contrast().toFixed(2);
    };
    document.getElementById('off_color').oninput = function() {
      lcdBlue.colors({ off: this.value });
      gray.colors({ off: this.value });
    };
    document.getElementById('on_color').oninput = function() {
      lcdBlue.colors({ on: this.value });
      gray.colors({ on: this.value });
    };

  </script>
</body>
</html>
